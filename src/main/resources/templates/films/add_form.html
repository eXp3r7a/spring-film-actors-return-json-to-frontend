<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta http-equiv="Content-Type" content="text/html" charset="UTF-8">
    <title>Add Film</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<header th:insert="header.html :: header"></header>
<h1>Film add form</h1>
<form action="#" th:action="@{/films/submit}" th:object="${film}" method="post">
    <p>Film title <input type="text" th:field="*{title}" required="required"  />
    <p th:if="${#fields.hasErrors('title')}" th:errors="*{title}">Name Error</p>

    <div th:if="${titleCheckerError}" style="color: red;">
        <p th:text="${titleCheckerError}"></p>
    </div>

    <p>Validate film title <input type="text" th:field="*{titleChecker}" required="required"  />
    <p th:if="${#fields.hasErrors('title')}" th:errors="*{titleChecker}">CheckerName Error</p>

    <p>Genre: <input type="text" th:field="*{genre}" required="required"/>
    <p th:if="${#fields.hasErrors('genre')}" th:errors="*{genre}">Genre Error</p>

    <p>Published year: <input type="number" th:field="*{publishedYear}" required="required" min="1900" max="2100"/>
    <p th:if="${#fields.hasErrors('publishedYear')}" th:errors="*{publishedYear}">found year Error</p>

    <p>Select Actors:</p>
    <select th:field="*{actors}" multiple size="4">
        <option th:each="actor : ${actors}" th:value="${actor.actor_id}" th:text="${actor.name}"></option>
    </select>
    <p th:if="${#fields.hasErrors('actors')}" th:errors="*{actors}">actors Error</p>
    <p><input type="submit" value="Submit" /> <input type="reset" value="Reset" /></p>
</form>
</body>
</html>
