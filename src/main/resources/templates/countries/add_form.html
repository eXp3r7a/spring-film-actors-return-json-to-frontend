<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta http-equiv="Content-Type" content="text/html" charset="UTF-8">
  <title>Add Country</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<header th:insert="header.html :: header"></header>
<h1>Country add form</h1>
<form action="#" th:action="@{/countries/submit}" th:object="${country}" method="post">
  <p>Country Name: <input type="text" th:field="*{name}" required="required"  />
    <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name Error</p>
  </p>
  <p>Number of citizens: <input type="text" th:field="*{numberOfCitizens}" required="required" min="1000000"/>
    <p th:if="${#fields.hasErrors('numberOfCitizens')}" th:errors="*{numberOfCitizens}">Name Error</p>
  </p>
  <p><input type="submit" value="Submit" /> <input type="reset" value="Reset" /></p>
</form>
</body>
</html>
