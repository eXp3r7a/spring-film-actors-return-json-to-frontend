<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta http-equiv="Content-Type" content="text/html" charset="UTF-8">
    <title>Add Actor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<header th:insert="header.html :: header"></header>
<h1>Actor add form</h1>
<form action="#" th:action="@{/actors/submit}" th:object="${actor}" method="post">
    <p>Actor Name: <input type="text" th:field="*{name}" required="required"/></p>
    <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name Error</p>
    <p>Actor Lastname: <input type="text" th:field="*{lastname}" /></p>
    <p th:if="${#fields.hasErrors('lastname')}" th:errors="*{lastname}">lastname Error</p>
    <p>Age: <input type="number" th:field="*{age}" required min="1" max="150"/></p>
    <p th:if="${#fields.hasErrors('age')}" th:errors="*{age}">age Error</p>
    <p>Gender:
        <input type="radio" th:field="*{gender}" value="Male" required/> Male
        <input type="radio" th:field="*{gender}" value="Female" required/> Female
    </p>
    <p>Country:
        <select th:field="*{country}">
            <option th:each="country : ${countries}" th:value="${country.country_id}" th:text="${country.name}"></option>
        </select>
    </p>
    <p><input type="submit" value="Submit" /> <input type="reset" value="Reset" /></p>
</form>
</body>
</html>
