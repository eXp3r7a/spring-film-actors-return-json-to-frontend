<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Print Actor Table</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<header th:insert="header.html :: header"></header>
<table>
    <tr>
        <th>Actor ID</th>
        <th>Actor name</th>
        <th>Actor Lastname</th>
        <th>Age</th>
        <th>Gender</th>
        <th>Country</th>
    </tr>
    <th:block th:each="actor: ${actors}">
        <tr>
            <td th:text="${actor.actor_id}">actorId</td>
            <td th:text="${actor.name}">name</td>
            <td th:text="${actor.lastname}">lastName</td>
            <td th:text="${actor.age}">age</td>
            <td th:text="${actor.gender}">gender</td>
            <td th:text="${actor.country.name}">country</td>
        </tr>
    </th:block>
</table>
</body>
</html>
